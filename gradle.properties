org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official
# The build wants a JDK 17 toolchain (app/build.gradle.kts) and takes only one the machine already
# has: JAVA_HOME, a standard install location or -Porg.gradle.java.installations.paths=<dir>.
org.gradle.java.installations.auto-download=false
# The Node runtime: nodejs-mobile's Android build of Node 24 (digidem's fork, the maintained line;
# docs/PLAN.md §4). Pinned by hand with the SHA-256 of the release zip, which node-runtime checks
# before using a byte of it and the SBOM records. Moving it: change both lines together, from the
# release page's zip, and say why in the commit.
nodejsMobile.version=24.20.0-0
nodejsMobile.sha256=f5ffbaf4f2679fa9180b0758c637c2f8fc8828300f95129badf213a028fb37bb
