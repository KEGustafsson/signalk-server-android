org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official
# The build wants a JDK 17 toolchain (app/build.gradle.kts) and takes only one the machine already
# has: JAVA_HOME, a standard install location or -Porg.gradle.java.installations.paths=<dir>.
org.gradle.java.installations.auto-download=false
# The Node runtime: nodejs-mobile's Android build of Node 24 (digidem's fork, the maintained line;
# docs/PLAN.md §4). Pinned by hand with the SHA-256 of the release zip, which node-runtime checks
# before using a byte of it and the SBOM records. Moving it: change both lines together, from the
# release page's zip, and say why in the commit.
nodejsMobile.version=24.20.0-0
nodejsMobile.sha256=f5ffbaf4f2679fa9180b0758c637c2f8fc8828300f95129badf213a028fb37bb
# The NDK libnode.so was built with (nodejs-mobile's docs/BUILDING.md, and the .comment section of
# the library). node-runtime builds the launcher and ships libc++_shared.so from it; the app
# strips the native libraries with it. Move it with nodejsMobile.version.
nodejsMobile.ndk=27.3.13750724
# npm, as the APK carries it (node-runtime puts the registry tarball into its assets and NodeRuntime
# unpacks it on first start). The npm that ships with the Node release above (nodejs.org's
# dist/index.json); its SHA-256 here, which the build checks. Move it with nodejsMobile.version.
npm.version=11.19.0
npm.sha256=31e9770f7dc71119a58509353b27917557aaf0ac9b5ef1a0465ee7d8ec67ae75
