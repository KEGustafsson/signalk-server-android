name: SignalK Plugin CI

# The Signal K project's reusable plugin CI, run against sk-plugin/android-bridge (the Android
# bridge's server half, docs/PLAN.md §7.2): it validates package.json, the entry point,
# plugin.schema(), the start/stop/start lifecycle and the plugin's API usage, packs the package
# the way the App Store installs it, and runs the tests with coverage on Linux x64 and arm64,
# macOS and Windows. Copied from Crew Radio's workflow of the same name, with one difference:
# Crew Radio calls it at `@master` because its plugin is on the App Store, whose Indicators tab
# looks for that reference. This plugin is not published (the app installs it), so the workflow
# is pinned to a commit like every other action here, and Dependabot moves the pin.
#
# armv7 (Cerbo GX, Node 20) is off: the plugin declares Node >=24 in package.json (engines).

on:
  push:
    branches: [main]
    paths: ["sk-plugin/**", ".github/workflows/signalk-ci.yml"]
  pull_request:
    paths: ["sk-plugin/**", ".github/workflows/signalk-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@7d96d5230d40b8fec9b7fd093d134fb22b39fad7 # master
    with:
      working-directory: sk-plugin/android-bridge
      node-versions: '["24"]'
      coverage-command: npm run coverage
      enable-armv7: false
